<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayıt Ol</title>
    
    
    <link rel="icon" type="image/png" href="/img/favicon.png">
    

    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/toast.css">
    
</head>

<body>

    <div class="background">
        <span class="square square-1"></span>
        <span class="square square-2"></span>
        <span class="square square-3"></span>
        <span class="square square-4"></span>
        <span class="square square-5"></span>
        <span class="square square-6"></span>
        <span class="square square-7"></span>
        <span class="square square-8"></span>
    </div>

    <main class="auth-page">

        <div class="light"></div>

        <section class="auth-card register-card">

            <div class="logo">
                K
            </div>

            <h1>Hesap Oluştur</h1>

            <p class="subtitle">
                Hesabını oluştur ve devam et.
            </p>

            <form action="/register" method="POST">

                <div class="form-group">
                    <label for="username">KULLANICI ADI</label>

                    <div class="input-box">
                        <span class="input-icon">♙</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Kullanıcı adınızı girin"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">E-POSTA</label>

                    <div class="input-box">
                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="E-posta adresinizi girin"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">ŞİFRE</label>

                    <div class="input-box">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Şifrenizi girin"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            ◉
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">ŞİFRE TEKRAR</label>

                    <div class="input-box">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="passwordConfirm"
                            name="passwordConfirm"
                            placeholder="Şifrenizi tekrar girin"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="submit-button">
                    &nbsp; Kayıt Ol
                </button>

            </form>

            <div class="divider">
                <span></span>
                <p>veya</p>
                <span></span>
            </div>

            <div class="register-link">
                Zaten hesabın var mı?  
                <a href="/login">  Giriş Yap</a>
            </div>

        </section>

    </main>

    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>

<script src="/js/toast.js"></script>
<script type="module" src="/js/auth.js"></script>

</body>
</html>
