<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    
    <link rel="icon" type="image/png" href="/img/favicon.png">

    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/toast.css">
    
</head>


<body>

    <div class="background">
        <span class="square square-1"></span>
        <span class="square square-2"></span>
        <span class="square square-3"></span>
        <span class="square square-4"></span>
        <span class="square square-5"></span>
        <span class="square square-6"></span>
        <span class="square square-7"></span>
        <span class="square square-8"></span>
    </div>

    <main class="auth-page">

        <div class="light"></div>

        <section class="auth-card">

            <div class="logo">
                K
            </div>

            <h1>Tekrar Hoşgeldin!</h1>

            <p class="subtitle">
                Hesabına giriş yaparak devam et.
            </p>

            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="username">KULLANICI ADI</label>

                    <div class="input-box">
                        <span class="input-icon">♙</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Kullanıcı Adı"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">ŞİFRE</label>

                    <div class="input-box">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Şifre"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            ◉
                        </button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        <span>Beni hatırla</span>
                    </label>

                    <a href="#" class="forgot">
                        Şifremi unuttum
                    </a>
                </div>

                <button type="submit" class="submit-button">
                     &nbsp; Giriş Yap
                </button>

            </form>

            <div class="divider">
                <span></span>
                <p>veya</p>
                <span></span>
            </div>

            <div class="register-link">
                Hesabın yok mu?
                <a href="/register">Kayıt Ol</a>
            </div>

        </section>

    </main>

    <div id="reset-modal" class="reset-modal">
    <div class="reset-box">

        <h2>Şifreni Sıfırla</h2>

        <p>E-posta adresini gir:</p>

        <input
            type="email"
            id="reset-email"
            placeholder="E-posta adresin"
        >

        <div class="reset-buttons">
            <button type="button" id="reset-cancel">
                İptal
            </button>

            <button type="button" id="reset-send">
                Gönder
            </button>
        </div>

    </div>
</div>

<script src="/js/toast.js"></script>
<script type="module" src="/js/auth.js"></script>

</body>
</html>
